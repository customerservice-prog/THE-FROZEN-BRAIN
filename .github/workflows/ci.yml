name: ColdVault Offline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q coldvault scripts tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Offline smoke test
        env:
          COLDVAULT_HOME: ${{ runner.temp }}/coldvault
        run: python scripts/smoke_test.py
